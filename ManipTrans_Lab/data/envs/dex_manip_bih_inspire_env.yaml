env_name: "dex_manip_bih"

# ---- dexhand (same type for both RH and LH) ------------------------------
# Mirrors ManipTrans main/cfg/task/ResDexHand.yaml (bi-manual uses the same cfg).
dexhand: "inspire"
episodeLength: 1200
actionScale: 1.0
training: True

useQuatRot: False
usePIDControl: False
actionsMovingAverage: 0.4   # README train.py flag
translationScale: 1.0
orientationScale: 0.1

# ---- demo data ----------------------------------------------------------
dataIndices: [0]
obsFutureLength: 1
rolloutStateInit: False
randomStateInit: True

# ---- curriculum (matches ResDexHand.yaml) ------------------------------
tightenMethod: "exp_decay"
tightenFactor: 0.7
tightenSteps: 3200

# ---- obs ----
obsKeys: ["q", "cos_q", "sin_q", "base_state"]
privilegedObsKeys:
  - "dq"
  - "manip_obj_pos"
  - "manip_obj_quat"
  - "manip_obj_vel"
  - "manip_obj_ang_vel"
  - "manip_obj_com"
  - "manip_obj_weight"
  - "tip_force"

# ---- assets ------------------------------------------------------------
table_file: "data/assets/furniture/table.usd"
manipObjAsset: "data/assets/objects/box.usd"
manipObjInitPos: [0.0, 0.0, 0.5]
manipObjInitRot: [0.0, 0.0, 0.0, 1.0]

camera_mode: "track"

engine:
    control_mode: "pos"
    control_freq: 60
    sim_freq: 120
