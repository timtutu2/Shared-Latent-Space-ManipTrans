env_name: "dex_manip_sh"

# ---- dexhand / task ------------------------------------------------------
dexhand: "shadow"
side: "right"
episodeLength: 1200
actionScale: 1.0
aggregateMode: 3
training: True

useQuatRot: False
# Match ManipTrans README PID branch for Shadow.
usePIDControl: True
actionsMovingAverage: 0.4
translationScale: 1.0
orientationScale: 0.1

# ---- demo data ----------------------------------------------------------
dataIndices: ["g102"]
obsFutureLength: 1
rolloutStateInit: False
randomStateInit: True
useBPSInTarget: True
bpsDim: 128

# ---- obs / reward shaping ----------------------------------------------
obsKeys: ["q", "cos_q", "sin_q", "base_state"]
privilegedObsKeys:
  - "dq"
  - "manip_obj_pos"
  - "manip_obj_quat"
  - "manip_obj_vel"
  - "manip_obj_ang_vel"
  - "tip_force"
  - "manip_obj_com"
  - "manip_obj_weight"
tightenMethod: "exp_decay"
tightenFactor: 0.7
tightenSteps: 3200

# ---- assets ------------------------------------------------------------
table_file: "data/assets/furniture/table.usd"
manipObjAsset: "data/motion_data/grab_demo/102/102_obj.usd"
manipObjInitPos: [0.0, 0.0, 0.5]
manipObjInitRot: [0.0, 0.0, 0.0, 1.0]

camera_mode: "still"

engine:
    control_mode: "pos"
    control_freq: 60
    sim_freq: 120

# Match ManipTrans Stage-2 curriculum:
# - gravity starts from 0x and linearly recovers to 1x
# - manip_obj friction starts from 3x and linearly recovers to 1x
task:
  randomize: True
  randomization_params:
    frequency: 32
    sim_params:
      gravity:
        operation: "scaling"
        schedule: "linear_decay"
        schedule_steps: 1920
        external_sample:
          type: "const_scale"
          init_value: 0
    actor_params:
      manip_obj:
        color: True
        rigid_shape_properties:
          friction:
            num_buckets: 250
            operation: "scaling"
            schedule: "linear_decay"
            schedule_steps: 1920
            external_sample:
              type: "const_scale"
              init_value: 3
              upper_bound: 6.0
              lower_bound: 1.0
