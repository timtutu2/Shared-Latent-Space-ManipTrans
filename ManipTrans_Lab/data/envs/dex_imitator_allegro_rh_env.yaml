env_name: "dex_imitator"

# ---- dexhand / task ------------------------------------------------------
dexhand: "allegro"
side: "right"
episodeLength: 2000
actionScale: 1.0
aggregateMode: 3
training: True

useQuatRot: False
# Match ManipTrans single-hand commands for Allegro PID branch.
usePIDControl: True
actionsMovingAverage: 0.4
translationScale: 1.0
orientationScale: 0.1

# ---- demo data ----------------------------------------------------------
dataIndices: ["g102"]
obsFutureLength: 1
rolloutStateInit: False
randomStateInit: True
deterministicResetInTest: True
randomStateInitInTest: False
resetWristPosNoiseStd: 0.01
resetWristRotNoiseRad: 0.1745
resetWristVelNoiseStd: 0.01
# Optional reset diagnostics (set true only when investigating alignment).
debugResetError: False
debugResetErrorInterval: 100

# ---- obs / reward shaping ----------------------------------------------
obsKeys: ["q", "cos_q", "sin_q", "base_state"]
privilegedObsKeys: ["dq"]
tightenMethod: "exp_decay"
tightenFactor: 0.7
tightenSteps: 128000
# Mitigate premature FAIL termination while policy stabilizes (matches Shadow).
failGraceStepsTrain: 32
failGraceStepsTest: 40
failDistanceScale: 1.15

camera_mode: "track"

engine:
    control_mode: "pos"
    control_freq: 60
    sim_freq: 120
