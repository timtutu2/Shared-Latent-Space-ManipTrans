agent_name: "DictPPO"

model:
  actor_net: "dict_feature_fusion"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.15         # was 0.05 — too narrow for 18-D action (force 3 + torque 3 + 12 dof). Imp_Ratio crashed to 0.05 because log_prob was ultra-sensitive to tiny policy changes. 0.15 widens exploration ~9x.

  critic_net: "dict_feature_fusion"
  critic_init_output_scale: 1.0

  # asymmetric actor-critic:
  # actor only sees proprioception + target; critic also sees privileged obs
  actor_obs_keys: ["proprioception", "target"]
  critic_obs_keys: ["proprioception", "privileged", "target"]

actor_optimizer:
    type: "Adam"
    learning_rate: 1e-4     # was 5e-4 — halved to make actor updates more conservative, preventing the Imp_Ratio blow-up.

critic_optimizer:
    type: "Adam"
    learning_rate: 5e-4

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 1.0   # was 10.0 — original weight penalizes wrist force/torque channels so hard that actor stays conservative. 1.0 loosens the bound penalty.
action_entropy_weight: 0.0
action_reg_weight: 0.0
