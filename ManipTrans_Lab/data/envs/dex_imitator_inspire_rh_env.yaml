env_name: "dex_imitator"

# ---- dexhand / task ------------------------------------------------------
dexhand: "inspire"          # one of: inspire, allegro, shadow, xhand, artimano, inspireftp
side: "right"               # "right" | "left"
episodeLength: 60           # the grab_demo 102 sequence is 60 frames
actionScale: 1.0
aggregateMode: 3
training: True

useQuatRot: False
usePIDControl: False
# Align with ManipTrans README (train.py --actionsMovingAverage=0.4)
# and DexHandImitator.yaml (translationScale=1.0, orientationScale=0.1).
actionsMovingAverage: 0.4
translationScale: 1.0
orientationScale: 0.1

# ---- demo data ----------------------------------------------------------
# The "g<seq>" prefix routes through ManipDataFactory.dataset_type -> "grabdemo",
# which is served by dataset/grab_demo_dataset.py (GrabDemoDexHandRH).
# Pkl files read from: $MANIPTRANS_DATA_ROOT/motion_data/grab_demo/<seq>/...
dataIndices: ["g102"]
# obsFutureLength=1 matches ManipTrans DexHandImitator.yaml
obsFutureLength: 1
rolloutStateInit: False
randomStateInit: True

# ---- obs / reward shaping ----------------------------------------------
obsKeys: ["q", "cos_q", "sin_q", "base_state"]
privilegedObsKeys: ["dq"]
# Match ManipTrans DexHandImitator.yaml: exp_decay schedule from 1.0 -> 0.7 over 128k steps
tightenMethod: "exp_decay"
tightenFactor: 0.7
tightenSteps: 128000

# ---- assets ------------------------------------------------------------
# Imitator doesn't require a table asset (skipped if not found).
# Uncomment and point at a USD to spawn one:
# table_file: "/abs/path/to/table.usd"

# ---- camera ------------------------------------------------------------
camera_mode: "track"

# ---- engine overrides (optional) ---------------------------------------
engine:
    control_mode: "pos"
    control_freq: 60
    sim_freq: 120
