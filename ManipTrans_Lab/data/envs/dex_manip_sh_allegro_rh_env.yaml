env_name: "dex_manip_sh"

# ---- dexhand / task ------------------------------------------------------
dexhand: "allegro"
side: "right"
episodeLength: 1200
actionScale: 1.0
aggregateMode: 3
training: True

useQuatRot: False
# Match ManipTrans README PID branch for Allegro.
usePIDControl: True
actionsMovingAverage: 0.4
translationScale: 1.0
orientationScale: 0.1

# ---- demo data ----------------------------------------------------------
dataIndices: ["g102"]
obsFutureLength: 1
rolloutStateInit: False
randomStateInit: True
useBPSInTarget: True
bpsDim: 128

# ---- obs / reward shaping ----------------------------------------------
obsKeys: ["q", "cos_q", "sin_q", "base_state"]
privilegedObsKeys:
  - "dq"
  - "manip_obj_pos"
  - "manip_obj_quat"
  - "manip_obj_vel"
  - "manip_obj_ang_vel"
  - "tip_force"
  - "manip_obj_com"
  - "manip_obj_weight"
tightenMethod: "exp_decay"
tightenFactor: 0.7
tightenSteps: 3200

# ---- assets ------------------------------------------------------------
table_file: "data/assets/furniture/table.usd"
manipObjAsset: "data/motion_data/grab_demo/102/102_obj.usd"
manipObjInitPos: [0.0, 0.0, 0.5]
manipObjInitRot: [0.0, 0.0, 0.0, 1.0]

camera_mode: "track"

engine:
    control_mode: "pos"
    control_freq: 60
    sim_freq: 120
