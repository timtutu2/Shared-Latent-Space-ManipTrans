env_name: "dex_manip_sh"

# ---- dexhand / task ------------------------------------------------------
# Values below mirror ManipTrans main/cfg/task/ResDexHand.yaml so that
# single-hand manipulation training matches the README configuration.
dexhand: "inspire"
side: "right"
episodeLength: 1200      # ResDexHand.yaml
actionScale: 1.0
aggregateMode: 3
training: True

useQuatRot: False        # ResDexHand.yaml: useQuatRot: false
usePIDControl: False
actionsMovingAverage: 0.4  # README train.py flag
translationScale: 1.0    # ResDexHand.yaml
orientationScale: 0.1    # ResDexHand.yaml

# ---- demo data ----------------------------------------------------------
dataIndices: [0]
obsFutureLength: 1       # ResDexHand.yaml
rolloutStateInit: False
randomStateInit: True
useBPSInTarget: True
bpsDim: 128

# ---- obs / reward shaping ----------------------------------------------
obsKeys: ["q", "cos_q", "sin_q", "base_state"]
privilegedObsKeys:
  - "dq"
  - "manip_obj_pos"
  - "manip_obj_quat"
  - "manip_obj_vel"
  - "manip_obj_ang_vel"
  - "tip_force"
  - "manip_obj_com"
  - "manip_obj_weight"
# ResDexHand.yaml curriculum: exp_decay from 1.0 to tightenFactor over 3200 steps
tightenMethod: "exp_decay"
tightenFactor: 0.7
tightenSteps: 3200

# ---- assets ------------------------------------------------------------
table_file: "data/assets/furniture/table.usd"
manipObjAsset: "data/assets/objects/mug.usd"
manipObjInitPos: [0.0, 0.0, 0.5]
manipObjInitRot: [0.0, 0.0, 0.0, 1.0]

camera_mode: "track"

engine:
    control_mode: "pos"
    control_freq: 60
    sim_freq: 120
